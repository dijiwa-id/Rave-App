# Lingkungan lokal mirip produksi (TDD §11.6): Postgres + Redpanda (Kafka API) + semua service.
#   docker compose up -d postgres redpanda   # infra saja, service dijalankan via `npm run dev`
#   docker compose up --build                # semuanya dalam container
x-svc: &svc
  build: { context: ., dockerfile: infra/Dockerfile.service }
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redpanda: { condition: service_healthy }
  environment: &env
    NODE_ENV: development
    DATABASE_URL: postgres://gema:gema@postgres:5432/gema
    JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32-bytes-min}
    BUS_DRIVER: kafka
    KAFKA_BROKERS: redpanda:9092
    MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-dev-media-signing-secret}
    PG_WEBHOOK_SECRET: ${PG_WEBHOOK_SECRET:-dev-pg-webhook-secret}
    INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret}
    IAM_URL: http://iam:4001
    CATALOG_URL: http://catalog:4002
    LIBRARY_URL: http://library:4003
    PLAYBACK_URL: http://playback:4004
    BOOKING_URL: http://booking:4005
    FINANCE_URL: http://finance:4006
    TICKETING_URL: http://ticketing:4007
    NOTIFICATION_URL: http://notification:4008

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: gema, POSTGRES_PASSWORD: gema, POSTGRES_DB: gema }
    ports: ['55432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U gema'], interval: 5s, retries: 20 }

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: >-
      redpanda start --smp 1 --memory 1G --overprovisioned --node-id 0 --check=false
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      --set redpanda.auto_create_topics_enabled=true
    ports: ['19092:19092']
    healthcheck: { test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true'"], interval: 10s, retries: 20 }

  iam: { <<: *svc, build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: iam } } }
  catalog: { <<: *svc, build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: catalog } } }
  library: { <<: *svc, build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: library } } }
  playback: { <<: *svc, build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: playback } } }
  booking: { <<: *svc, build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: booking } } }
  finance: { <<: *svc, build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: finance } } }
  ticketing: { <<: *svc, build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: ticketing } } }
  notification: { <<: *svc, build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: notification } } }
  gateway:
    <<: *svc
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: gateway } }
    ports: ['8080:8080']

volumes:
  pgdata:
